<style>
:root{
  --bg:#eef1f6; --card:#fff; --ink:#0b1220; --muted:#3b4558; --line:#9aa6b8;
  --blue:#1d4ed8; --blue-d:#1e3a8a; --green:#15803d; --red:#b91c1c; --amber:#b45309;
  --sel:#facc15; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:20px;line-height:1.3}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer;border:none}
input{font:inherit;font-size:22px}
h1,h2,h3{margin:0 0 12px}
h2{font-size:28px} h3{font-size:23px}
.hidden{display:none!important}

/* Yläpalkki */
#top{position:sticky;top:0;z-index:20;background:var(--blue-d);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
#tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:#334f9e;color:#fff;min-height:58px;padding:0 18px;border-radius:12px;font-size:21px;font-weight:700}
.tab.on{background:#fff;color:var(--blue-d)}
#matchinfo{flex:1;min-width:160px;font-size:19px;font-weight:600;text-align:right;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{padding:12px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Peruspainikkeet */
.btn{min-height:62px;padding:0 22px;border-radius:12px;font-weight:700;font-size:21px;background:var(--blue);color:#fff}
.btn.big{min-height:72px;font-size:24px}
.btn.gray{background:#d7dde7;color:var(--ink)}
.btn.red{background:var(--red)} .btn.green{background:var(--green)}
.btn:active{filter:brightness(.85)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Kirjausnäkymä */
#rec{display:grid;grid-template-columns:minmax(0,43fr) minmax(0,57fr);grid-template-areas:'left actions' 'recent actions';grid-template-rows:auto 1fr;gap:12px;align-items:start}
#left{grid-area:left} #actions{grid-area:actions} #recent{grid-area:recent}
#setbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#setbar .lbl{font-size:26px;font-weight:800;min-width:110px;text-align:center}
.sq{min-width:64px;min-height:62px;border-radius:12px;font-size:30px;font-weight:800;background:#d7dde7}
#undo{margin-left:auto;background:var(--amber);color:#fff;min-height:62px;padding:0 22px;border-radius:12px;font-size:23px;font-weight:800}
#players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pl{position:relative;background:#fff;border:3px solid var(--line);border-radius:var(--r);min-height:112px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pl .n{font-size:44px;font-weight:900;line-height:1}
.pl .nm{font-size:20px;font-weight:600;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .badge{position:absolute;top:5px;right:6px;background:var(--amber);color:#fff;font-size:15px;font-weight:800;border-radius:8px;padding:2px 7px}
.pl.on{background:var(--blue);border-color:var(--sel);box-shadow:0 0 0 4px var(--sel);color:#fff}
#actions{position:relative}
#actions.off .act{opacity:.35}
#selinfo{font-size:22px;font-weight:800;height:62px;overflow:hidden;line-height:1.12;display:flex;align-items:center;padding:0 14px;border-radius:12px;background:#fff;border:3px dashed var(--line);margin-bottom:10px}
#selinfo.on{border:3px solid var(--sel);background:#fffbe6}
#selinfo.done{border:3px solid #0f5c2c;background:var(--green);color:#fff;font-size:20px}
.skill{display:grid;grid-template-columns:128px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.act.gr{position:relative;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 6px;min-width:0}
.act.gr .em{position:absolute;top:3px;right:4px;background:var(--red);color:#fff;font-size:14px;font-weight:800;line-height:1;padding:3px 5px;border-radius:6px}
.act.gr .em.ep{background:var(--green)}
.act.gr .gn{font-size:34px;font-weight:900;line-height:1}
.act.gr .gl{font-size:15px;font-weight:700;line-height:1.12;margin-top:4px;text-align:center;max-width:100%;overflow-wrap:break-word}
.gtxt{font-size:18px;color:var(--muted)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 24px;font-size:18px}
.legend b{display:block;margin-top:4px}
.legend .q{display:inline-block;min-width:26px;text-align:center;font-weight:800;border-radius:6px;margin-right:6px;border:2px solid}
.skill .lbl{font-size:20px;font-weight:800;line-height:1.15}
.skill .lbl small{display:block;font-size:15px;font-weight:700;color:var(--green)}
.grades{display:grid;gap:8px}
.act{min-height:68px;border-radius:12px;font-size:30px;font-weight:900;background:#dbe6ff;color:var(--blue-d);border:3px solid #9db4f0}
/* Arvosanavärit: 1 = paras (vihreä) ... suurin = huonoin (punainen) */
.act.q1{background:#bbf7d0;border-color:#15803d;color:#064e1f}
.act.q2{background:#e2f7a8;border-color:#65a30d;color:#365314}
.act.qm{background:#fde4b0;border-color:#d97706;color:#78350f}
.act.qw{background:#fecaca;border-color:#b91c1c;color:#7f1d1d}
.skill.P.hi{background:#fff4d6;outline:3px solid var(--amber);border-radius:12px}
.skill.P.dim{opacity:.55}
.skill.P.hi .lbl::before{content:"★ ";color:var(--amber)}
.secthead{font-size:18px;font-weight:800;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.multi{display:grid;gap:8px}
.multi.three{grid-template-columns:repeat(3,1fr)}
.multi.four{grid-template-columns:repeat(4,1fr)}
.act.pt{background:var(--green);color:#fff;border-color:#0f5c2c;font-size:20px;line-height:1.1;padding:4px;-webkit-hyphens:manual;hyphens:manual}
.act.er{background:var(--red);color:#fff;border-color:#7f1515;font-size:19px;line-height:1.1;padding:4px;-webkit-hyphens:manual;hyphens:manual}
.act small{display:block;font-size:17px;font-weight:700;opacity:.95}
#recent{background:#fff;border-radius:12px;padding:8px 12px;font-size:18px}
#recent div{padding:3px 0;border-bottom:1px solid #e3e7ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#recent div:last-child{border:none}

/* Taulukot */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:18px;background:#fff}
th,td{border:1px solid #c3cad6;padding:6px 6px;text-align:center;vertical-align:middle}
th{background:#e4e9f2;font-size:16px;line-height:1.15}
th.grp{font-size:17px}
td.nm{text-align:left;font-weight:700;white-space:nowrap}
td .ka{display:block;font-size:15px;color:var(--muted)}
tr.tot td{background:#fff6d6;font-weight:800;border-top:3px solid #333}
td.pos{color:var(--green);font-weight:800} td.neg{color:var(--red);font-weight:800}
td.net{font-size:22px;font-weight:900}
.zero{color:#a3abb8}
/* Arvosanajakauma */
#disttable{font-size:18px;table-layout:auto}
#disttable th,#disttable td{padding:6px 3px}
#disttable th.sk{font-size:18px}
#disttable th.g{font-size:19px;font-weight:900;min-width:34px}
#disttable th.g.q1{background:#bbf7d0;color:#064e1f} #disttable th.g.q2{background:#e2f7a8;color:#365314}
#disttable th.g.qm{background:#fde4b0;color:#78350f} #disttable th.g.qw{background:#fecaca;color:#7f1d1d}
#disttable .s0{border-left:3px solid #4b5563}
#disttable td.kpl{font-weight:800;background:#f6f7f9}
#disttable td.ka{font-weight:800;background:#f6f7f9;white-space:nowrap}
#disttable td.d{font-weight:700}
#disttable tr.tot td.kpl,#disttable tr.tot td.ka{background:#fff0bf}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg button{min-height:58px;padding:0 20px;border-radius:12px;background:#d7dde7;font-weight:700;font-size:21px}
.seg button.on{background:var(--blue);color:#fff}

/* Loki */
.logrow{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid #dde2ea;font-size:21px}
.logrow .t{color:var(--muted);font-size:17px;min-width:110px}
.logrow .what{flex:1}
.logrow .del{min-height:58px;padding:0 18px;border-radius:12px;background:#fde2e2;color:var(--red);font-weight:800;border:2px solid var(--red)}
.tag{display:inline-block;padding:2px 10px;border-radius:8px;font-weight:800;font-size:18px;margin-left:6px}
.tag.p{background:#dcfce7;color:var(--green)} .tag.m{background:#fee2e2;color:var(--red)} .tag.g{background:#dbe6ff;color:var(--blue-d)}

/* Pelaajat */
.prow{display:grid;grid-template-columns:110px 1fr 190px 70px;gap:10px;align-items:center;margin-bottom:10px}
.prow input[type=text],.prow input[type=number],.field input{width:100%;min-height:62px;border:3px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;color:var(--ink)}
.prow input:focus,.field input:focus{outline:none;border-color:var(--blue)}
.chk{display:flex;align-items:center;gap:10px;min-height:62px;padding:0 12px;border-radius:12px;background:#f3f4f6;border:3px solid var(--line);font-weight:700}
.chk input{width:34px;height:34px;accent-color:var(--amber)}
.chk.on{background:#fdecc8;border-color:var(--amber)}
.x{min-height:62px;border-radius:12px;background:#fde2e2;color:var(--red);font-size:30px;font-weight:900;border:2px solid var(--red)}
.field{margin-bottom:12px} .field label{display:block;font-weight:700;margin-bottom:6px}
.help{color:var(--muted);font-size:18px;margin:6px 0 12px}

/* Ottelut */
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #dde2ea;flex-wrap:wrap}
.mrow .info{flex:1;min-width:240px}
.mrow .info b{font-size:23px}
.mrow.cur{background:#fffbe6}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:22px}

/* Ilmoitus ja dialogi */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--green);color:#fff;font-size:26px;font-weight:800;padding:18px 30px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:50;opacity:0;pointer-events:none;transition:opacity .15s;max-width:92vw;text-align:center}
#toast.show{opacity:1} #toast.warn{background:var(--amber)} #toast.bad{background:var(--red)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
#modal .box{background:#fff;border-radius:18px;padding:24px;max-width:560px;width:100%;font-size:23px}
#modal .row{justify-content:flex-end;margin-top:20px}

@media (min-width:901px){ #toast{left:24px;transform:none;max-width:38%} }
@media (max-width:900px){
  #rec{grid-template-columns:1fr;grid-template-areas:'left' 'actions' 'recent';grid-template-rows:auto}
  #players{grid-template-columns:repeat(4,1fr)}
  .pl{min-height:96px}
  .prow{grid-template-columns:90px 1fr 160px 64px}
}
@media (orientation:landscape) and (max-height:900px){
  .pl{min-height:104px}
}
#pdfrow{margin:-2px 0 12px}
#pdfrow .btn.big{min-width:220px}
#pdfrow .pdfnote{color:var(--muted);font-size:18px}
.printonly{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}
  html,body{background:#fff !important;font-size:11pt}
  body{padding:0}
  #top,#toast,#modal,.noprint,button{display:none !important}
  main{padding:0}
  .printonly{display:inline}
  .card{box-shadow:none;border-radius:0;padding:0 0 8px;margin:0 0 10px;background:#fff}
  .tablewrap{overflow:visible}
  h2{font-size:15pt;margin:0 0 6px} h3{font-size:12pt}
  table{font-size:9pt} th{font-size:8pt} th.grp{font-size:8.5pt}
  th,td{padding:2px 3px} td .ka{font-size:7.5pt} td.net{font-size:10pt}
  #disttable{font-size:9pt} #disttable th.sk{font-size:9pt} #disttable th.g{font-size:9pt;min-width:0} #disttable th,#disttable td{padding:2px 2px}
  .help{font-size:8pt;margin:3px 0 6px}
  .legend{font-size:8.5pt;gap:2px 16px}
  .legend .tag{font-size:8.5pt;padding:0 5px}
  tr{break-inside:avoid}
  .distcard{break-before:page}
  th,td,.legend .q{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header id="top">
  <nav id="tabs">
    <button class="tab" data-v="kirjaa">Kirjaa</button>
    <button class="tab" data-v="yhteenveto">Yhteenveto</button>
    <button class="tab" data-v="loki">Loki</button>
    <button class="tab" data-v="ottelut">Ottelut</button>
    <button class="tab" data-v="pelaajat">Pelaajat</button>
  </nav>
  <div id="matchinfo"></div>
</header>
<main id="main"></main>
<div id="toast"></div>
<div id="modal" class="hidden"><div class="box"><div id="mtext"></div><div class="row"><button class="btn gray" id="mno">Peruuta</button><button class="btn red" id="myes">OK</button></div></div></div>

<script>
'use strict';
// ---------- Määritykset ----------
var KEY = 'lentopallo_tilastot_v1';
// Taitojen järjestys kaikkialla (kirjaus, yhteenveto, jakauma, CSV): Syöttö, Vastaanotto, Passi, Hyökkäys
var SKILLS = [
  {k:'S', name:'Syöttö', max:4, plural:'Syötöt',
   labels:['ässä / seinille', 'vo rikki, ei hyvä', 'kuppi, nosto vastustajalle', 'virhe']},
  {k:'V', name:'Vastaanotto', max:4, plural:'Vastaanotot',
   labels:['kuppi / keskiuhka', 'passattavissa', 'jää kauas 4–5 m', 'ässä / virhe']},
  {k:'P', name:'Passi', max:2, plural:'Passit',
   labels:['hyvä passi / pystyy lyömään', 'lyömätön / verkon päällä']},
  {k:'H', name:'Hyökkäys', max:3, plural:'Hyökkäykset',
   labels:['piste', 'pallon saa pelattua', 'torjunta / virhe']}
];
var POINTS = [
  {k:'AS', name:'Ässä', label:'Ässä', short:'Ässä', plural:'Ässät'},
  {k:'HP', name:'Hyökkäyspiste', label:'Hyökkäys&shy;piste', short:'Hyökk.&shy;piste', plural:'Hyökkäyspisteet'},
  {k:'TP', name:'Torjuntapiste', label:'Torjunta&shy;piste', short:'Torjunta&shy;piste', plural:'Torjuntapisteet'}
];
var ERRORS = [
  {k:'SV', name:'Syöttövirhe', label:'Syöttö&shy;virhe', short:'Syöttö&shy;virhe', plural:'Syöttövirheet'},
  {k:'VOV', name:'Vastaanottovirhe', label:'Vastaan&shy;otto&shy;virhe', short:'Vast.otto&shy;virhe', plural:'Vastaanottovirheet'},
  {k:'HV', name:'Hyökkäysvirhe', label:'Hyökkäys&shy;virhe', short:'Hyökk.&shy;virhe', plural:'Hyökkäysvirheet'},
  {k:'VV', name:'Verkkovirhe', label:'Verkko&shy;virhe', short:'Verkko&shy;virhe', plural:'Verkkovirheet'}
];
var BYKEY = {};
SKILLS.forEach(function(s){ BYKEY[s.k] = {kind:'g', d:s}; });
POINTS.forEach(function(s){ BYKEY[s.k] = {kind:'p', d:s}; });
ERRORS.forEach(function(s){ BYKEY[s.k] = {kind:'e', d:s}; });
var MAXP = 12;
// Pisteet, jotka kirjaavat samalla arvosanan (1 = paras): yksi tapahtuma, kaksi vaikutusta
// Yhdistetyt kirjaukset: yksi tapahtuma vaikuttaa sekä pisteisiin/virheisiin että arvosanaan.
var LINK = {
  HP:{skill:'H', g:1}, AS:{skill:'S', g:1},              // piste +1 ja arvosana 1
  VOV:{skill:'V', g:4}, SV:{skill:'S', g:4}, HV:{skill:'H', g:3}  // virhe −1 ja huonoin arvosana
};
// Huonoin arvosana = virhe: arvosanapainike kirjaa saman yhdistetyn tapahtuman kuin virhepainike
var GRADE2ERR = { V4:'VOV', S4:'SV', H3:'HV' };
// Paras arvosana = piste: Hyökkäys 1 kirjaa saman yhdistetyn tapahtuman kuin Hyökkäyspiste-painike
// ja Syöttö 1 saman kuin Ässä-painike
var GRADE2PT = { H1:'HP', S1:'AS' };
// Tulkinta laskentaa varten: myös vanhat tallennetut Hyökkäys 1- ja Syöttö 1 -merkinnät lasketaan pisteiksi
// (takautuva korjaus ilman tallennetun datan muuttamista). Yksi merkintä = arvosana 1 + piste +1, kerran.
function eff(e){ var k = (e && e.g != null) ? GRADE2PT[e.type + e.g] : null; return k ? Object.assign({}, e, {type:k}) : e; }
// Yhdistetty vaikutus lasketaan vain, jos tapahtumaan on tallennettu arvosana
// (vanhat erilliset kirjaukset ilman arvosanaa säilyvät ennallaan).
function linkOf(e){ var l = LINK[e.type]; return (l && e.g === l.g) ? l : null; }
// Arvosanan väriluokka: 1 = paras (vihreä), suurin numero = huonoin (punainen)
function gradeCls(g, max){
  if (g === 1) return 'q1';
  if (g === max) return 'qw';
  return (max === 4 && g === 2) ? 'q2' : 'qm';
}
function skillOf(k){ for (var i=0;i<SKILLS.length;i++) if (SKILLS[i].k===k) return SKILLS[i]; return null; }
function gradeText(k, g){ var s = skillOf(k); return (s && s.labels[g-1]) || ''; }
function skillName(k){ for (var i=0;i<SKILLS.length;i++) if (SKILLS[i].k===k) return SKILLS[i].name; return k; }

// ---------- Tila ----------
var S = load();
var view = null, selPid = null, sumSet = 'all';

function blank(){ return {roster:[], matches:[], currentId:null}; }
function load(){
  try { var o = JSON.parse(localStorage.getItem(KEY)); if (o && Array.isArray(o.roster) && Array.isArray(o.matches)) return o; } catch(e) {}
  return blank();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Tallennus epäonnistui! Muisti täynnä?', 'bad'); }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function cur(){ for (var i=0;i<S.matches.length;i++) if (S.matches[i].id === S.currentId) return S.matches[i]; return null; }
function today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return (n<10?'0':'')+n; }
function fiDate(iso){ if(!iso) return ''; var p=iso.split('-'); return p.length===3 ? (+p[2])+'.'+(+p[1])+'.'+p[0] : iso; }
function fiTime(ts){ var d=new Date(ts); return pad(d.getHours())+'.'+pad(d.getMinutes())+'.'+pad(d.getSeconds()); }
function localDate(ts){ var d=new Date(ts); return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear(); }
function dec(x){ return x.toFixed(2).replace('.', ','); }
function sortedRoster(){ return S.roster.slice().sort(function(a,b){ return (parseInt(a.num,10)||999) - (parseInt(b.num,10)||999) || String(a.name).localeCompare(String(b.name),'fi'); }); }
function pById(pid){ for (var i=0;i<S.roster.length;i++) if (S.roster[i].id===pid) return S.roster[i]; return null; }
function evLabel(e){
  e = eff(e);
  var b = BYKEY[e.type]; if(!b) return e.type;
  if (b.kind==='g') return b.d.name + ' ' + e.g + (gradeText(e.type, e.g) ? ' – ' + gradeText(e.type, e.g) : '');
  var l = linkOf(e);
  return b.d.name + (b.kind==='p' ? ' +1' : ' −1') + (l ? ' (' + skillName(l.skill).toLowerCase() + ' ' + l.g + ')' : '');
}
function evTag(e){
  e = eff(e);
  var b = BYKEY[e.type]; if(!b) return '';
  if (b.kind==='g') return '<span class="tag g">'+esc(b.d.name)+' '+e.g+'</span> <span class="gtxt">'+esc(gradeText(e.type, e.g))+'</span>';
  var l = linkOf(e);
  return '<span class="tag '+(b.kind==='p'?'p':'m')+'">'+esc(b.d.name)+(b.kind==='p'?' +1':' −1')+'</span>'
    + (l ? '<span class="tag g">'+esc(skillName(l.skill))+' '+l.g+'</span> <span class="gtxt">'+esc(gradeText(l.skill, l.g))+'</span>' : '');
}
function pLabel(num, name){ return (num!==''&&num!=null ? '#'+num+' ' : '') + (name||''); }

// ---------- Yleiset UI-apurit ----------
var tt = null;
function toast(msg, cls){
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + (cls||'');
  clearTimeout(tt); tt = setTimeout(function(){ t.className = ''; }, 1400);
}
function ask(msg, yesLabel, cb){
  var m = document.getElementById('modal');
  document.getElementById('mtext').textContent = msg;
  var y = document.getElementById('myes'); y.textContent = yesLabel || 'OK';
  m.classList.remove('hidden');
  document.getElementById('mno').onclick = function(){ m.classList.add('hidden'); };
  y.onclick = function(){ m.classList.add('hidden'); cb(); };
}

// ---------- Navigointi ----------
document.getElementById('tabs').addEventListener('click', function(ev){
  var b = ev.target.closest('.tab'); if (b) go(b.dataset.v);
});
function go(v){
  view = v;
  if (v !== 'kirjaa') selPid = null;
  var tabs = document.querySelectorAll('.tab');
  for (var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', tabs[i].dataset.v === v);
  var m = cur();
  document.getElementById('matchinfo').textContent = m ? ('vs ' + (m.opponent||'?') + ' · ' + fiDate(m.date)) : 'Ei valittua ottelua';
  ({kirjaa:renderRec, yhteenveto:renderSum, loki:renderLog, ottelut:renderMatches, pelaajat:renderRoster}[v])();
  window.scrollTo(0,0);
}

// ---------- Kirjaus ----------
function renderRec(){
  var main = document.getElementById('main'), m = cur();
  if (!S.roster.length){ main.innerHTML = '<div class="card empty">Lisää ensin pelaajat.<br><br><button class="btn big" onclick="go(\'pelaajat\')">Lisää pelaajat</button></div>'; return; }
  if (!m){ main.innerHTML = '<div class="card empty">Aloita ensin uusi ottelu.<br><br><button class="btn big" onclick="go(\'ottelut\')">Uusi ottelu</button></div>'; return; }
  var h = '<div id="rec"><section id="left"><div id="setbar">'
    + '<button class="sq" id="setminus" aria-label="Edellinen erä">−</button><div class="lbl" id="setlbl">Erä '+m.set+'</div>'
    + '<button class="sq" id="setplus" aria-label="Seuraava erä">+</button>'
    + '<button id="undo">↶ Kumoa</button></div><div id="players">';
  sortedRoster().forEach(function(p){
    h += '<button class="pl'+(p.id===selPid?' on':'')+'" data-pid="'+p.id+'">'+(p.setter?'<span class="badge">PASSARI</span>':'')
      + '<span class="n">'+esc(p.num)+'</span><span class="nm">'+esc(p.name)+'</span></button>';
  });
  h += '</div></section><div id="recent"></div><section id="actions"><div id="selinfo"></div>';
  SKILLS.forEach(function(s){
    h += '<div class="skill '+s.k+'"><div class="lbl">'+s.name+'<small>1 = paras</small></div><div class="grades" style="grid-template-columns:repeat('+s.max+',1fr)">';
    for (var g=1; g<=s.max; g++) h += '<button class="act gr '+gradeCls(g, s.max)+'" data-t="'+s.k+'" data-g="'+g+'" aria-label="'+s.name+' '+g+': '+esc(s.labels[g-1])+(g===1?' (paras)':g===s.max?' (huonoin)':'')+(GRADE2ERR[s.k+g]?', virhe −1':'')+(GRADE2PT[s.k+g]?', '+BYKEY[GRADE2PT[s.k+g]].d.name.toLowerCase()+' +1':'')+'">'+(GRADE2ERR[s.k+g] ? '<span class="em">−1</span>' : '')+(GRADE2PT[s.k+g] ? '<span class="em ep">+1</span>' : '')+'<span class="gn">'+g+'</span><span class="gl">'+esc(s.labels[g-1]).replace(/(\d+–\d+ m)$/, '<span style="white-space:nowrap">$1</span>')+'</span></button>';
    h += '</div></div>';
  });
  h += '<div class="secthead">Pisteet (+1)</div><div class="multi three">';
  POINTS.forEach(function(s){ var l = LINK[s.k]; h += '<button class="act pt" data-t="'+s.k+'">'+s.label+'<small>+1'+(l ? ' · '+skillName(l.skill).toLowerCase()+' '+l.g : '')+'</small></button>'; });
  h += '</div><div class="secthead">Virheet (−1)</div><div class="multi four">';
  ERRORS.forEach(function(s){ var l = LINK[s.k]; h += '<button class="act er" data-t="'+s.k+'">'+s.label+'<small>−1'+(l ? ' · '+skillName(l.skill).toLowerCase()+' '+l.g : '')+'</small></button>'; });
  h += '</div></section></div>';
  main.innerHTML = h;
  document.getElementById('players').onclick = function(ev){
    var b = ev.target.closest('.pl'); if (!b) return;
    selPid = (selPid === b.dataset.pid) ? null : b.dataset.pid;
    updSel();
  };
  document.getElementById('actions').onclick = function(ev){
    var b = ev.target.closest('.act'); if (!b) return;
    if (!selPid){ toast('Valitse ensin pelaaja', 'warn'); return; }
    record(b.dataset.t, b.dataset.g ? +b.dataset.g : null);
  };
  document.getElementById('undo').onclick = undo;
  document.getElementById('setminus').onclick = function(){ setSet(-1); };
  document.getElementById('setplus').onclick = function(){ setSet(1); };
  updSel(); updRecent();
}
var ft = null;
function flash(msg){
  var si = document.getElementById('selinfo'); if (!si) return;
  clearTimeout(ft); si.className = 'done'; si.textContent = msg;
  ft = setTimeout(function(){ ft = null; if (document.getElementById('selinfo')) updSel(); }, 1600);
}
function updSel(){
  if (ft){ clearTimeout(ft); ft = null; }
  var pls = document.querySelectorAll('.pl');
  for (var i=0;i<pls.length;i++) pls[i].classList.toggle('on', pls[i].dataset.pid === selPid);
  var p = selPid ? pById(selPid) : null;
  var si = document.getElementById('selinfo');
  si.className = p ? 'on' : '';
  si.textContent = p ? ('Valittu: ' + pLabel(p.num, p.name) + (p.setter ? ' (passari)' : '')) : '1. Valitse pelaaja  →  2. Valitse suoritus';
  document.getElementById('actions').classList.toggle('off', !p);
  var ps = document.querySelector('.skill.P');
  if (ps){ ps.classList.toggle('hi', !!(p && p.setter)); ps.classList.toggle('dim', !!(p && !p.setter)); }
}
function updRecent(){
  var m = cur(), el = document.getElementById('recent'); if (!m || !el) return;
  var ev = m.events.slice(-4).reverse();
  el.innerHTML = '<b>Viimeisimmät:</b>' + (ev.length ? ev.map(function(e){
    return '<div>Erä '+e.set+' · '+esc(pLabel(e.num,e.name))+' · '+esc(evLabel(e))+'</div>'; }).join('') : '<div class="zero">Ei vielä kirjauksia</div>');
}
function record(type, g){
  var m = cur(), p = pById(selPid); if (!m || !p) return;
  if (g != null && GRADE2ERR[type + g]) type = GRADE2ERR[type + g];
  else if (g != null && GRADE2PT[type + g]) type = GRADE2PT[type + g];
  if (LINK[type]) g = LINK[type].g;
  var e = {id:uid(), ts:Date.now(), set:m.set, pid:p.id, num:p.num, name:p.name, type:type, g:g};
  m.events.push(e);
  syncMatchPlayer(m, p);
  save();
  selPid = null; updSel(); updRecent();
  flash('✓ ' + pLabel(p.num, p.name) + ': ' + evLabel(e));
}
function undo(){
  var m = cur(); if (!m || !m.events.length){ toast('Ei kumottavaa', 'warn'); return; }
  var e = m.events.pop(); save();
  toast('Kumottu: ' + pLabel(e.num, e.name) + ' – ' + evLabel(e), 'warn');
  updRecent();
}
function setSet(d){
  var m = cur(); if (!m) return;
  m.set = Math.max(1, Math.min(9, m.set + d)); save();
  document.getElementById('setlbl').textContent = 'Erä ' + m.set;
  toast('Erä ' + m.set);
}
function syncMatchPlayer(m, p){
  m.players = m.players || [];
  for (var i=0;i<m.players.length;i++) if (m.players[i].id===p.id){ m.players[i].num=p.num; m.players[i].name=p.name; m.players[i].setter=!!p.setter; return; }
  m.players.push({id:p.id, num:p.num, name:p.name, setter:!!p.setter});
}

// ---------- Laskenta ----------
function emptyStat(){
  var o = {plus:0, minus:0};
  SKILLS.forEach(function(s){ o[s.k] = {n:0, sum:0, dist:new Array(s.max+1).fill(0)}; });
  POINTS.concat(ERRORS).forEach(function(s){ o[s.k] = 0; });
  return o;
}
function addEv(o, e){
  e = eff(e);
  var b = BYKEY[e.type]; if (!b) return;
  if (b.kind==='g'){ var x=o[e.type]; x.n++; x.sum+=e.g; if (e.g < x.dist.length) x.dist[e.g]++; }
  else {
    o[e.type]++; if (b.kind==='p') o.plus++; else o.minus++;
    var l = linkOf(e);
    if (l){ var y = o[l.skill]; y.n++; y.sum += l.g; y.dist[l.g]++; }
  }
}
function summarize(m, set){
  var rows = {}, order = [], team = emptyStat();
  (m.players||[]).forEach(function(p){ if(!rows[p.id]){ rows[p.id] = {p:{id:p.id,num:p.num,name:p.name}, s:emptyStat()}; order.push(p.id); } });
  m.events.forEach(function(e){
    if (set !== 'all' && e.set !== set) return;
    if (!rows[e.pid]){ rows[e.pid] = {p:{id:e.pid,num:e.num,name:e.name}, s:emptyStat()}; order.push(e.pid); }
    addEv(rows[e.pid].s, e); addEv(team, e);
  });
  var list = order.map(function(id){ return rows[id]; });
  list.sort(function(a,b){ return (parseInt(a.p.num,10)||999)-(parseInt(b.p.num,10)||999); });
  return {rows:list, team:team};
}
function setsOf(m){
  var mx = m.set || 1; m.events.forEach(function(e){ if (e.set > mx) mx = e.set; });
  var a=[]; for (var i=1;i<=mx;i++) a.push(i); return a;
}

// ---------- Yhteenveto ----------
function cellSkill(x){
  if (!x.n) return '<td class="zero">–</td>';
  return '<td><b>'+x.n+'</b> kpl<span class="ka">ka '+dec(x.sum/x.n)+'</span></td>';
}
function cellN(n, cls){ return n ? '<td class="'+cls+'">'+n+'</td>' : '<td class="zero">0</td>'; }
function statCells(s){
  var h = '';
  SKILLS.forEach(function(k){ h += cellSkill(s[k.k]); });
  POINTS.forEach(function(k){ h += cellN(s[k.k], 'pos'); });
  ERRORS.forEach(function(k){ h += cellN(s[k.k], 'neg'); });
  var net = s.plus - s.minus;
  h += '<td class="pos">'+s.plus+'</td><td class="neg">'+s.minus+'</td><td class="net '+(net>0?'pos':net<0?'neg':'')+'">'+(net>0?'+':'')+net+'</td>';
  return h;
}
function legendHtml(){
  var qc = {q1:'#bbf7d0;border-color:#15803d', q2:'#e2f7a8;border-color:#65a30d', qm:'#fde4b0;border-color:#d97706', qw:'#fecaca;border-color:#b91c1c'};
  var h = '<div class="card"><h3>Arvosanojen selitteet (1 = paras)</h3><div class="legend">';
  SKILLS.forEach(function(s){
    h += '<div><b>' + s.name + '</b>';
    s.labels.forEach(function(t, i){ var ek = GRADE2ERR[s.k + (i+1)], pk = GRADE2PT[s.k + (i+1)]; h += '<div><span class="q" style="background:' + qc[gradeCls(i+1, s.max)] + '">' + (i+1) + '</span>' + esc(t) + (ek ? ' <span class="tag m">= ' + esc(BYKEY[ek].d.name) + ' −1</span>' : '') + (pk ? ' <span class="tag p">= ' + esc(BYKEY[pk].d.name) + ' +1</span>' : '') + '</div>'; });
    h += '</div>';
  });
  return h + '</div></div>';
}
// Jakaumataulukko: joka taidolle sarakkeet 1..max, kpl, ka (1 = paras)
function distCells(st){
  var h = '';
  SKILLS.forEach(function(k){
    var x = st[k.k];
    for (var g=1; g<=k.max; g++){
      var c = x.dist[g];
      h += '<td class="d'+(g===1?' s0':'')+(c?'':' zero')+'">'+(x.n ? c : '')+'</td>';
    }
    h += x.n ? '<td class="kpl">'+x.n+'</td><td class="ka">'+dec(x.sum/x.n)+'</td>' : '<td class="kpl zero">–</td><td class="ka zero">–</td>';
  });
  return h;
}
function distHtml(sm, set){
  var h = '<div class="card distcard"><h2>Arvosanajakauma – '+(set==='all' ? 'koko ottelu' : 'erä '+set)+'</h2>'
    + '<p class="help" style="margin-top:-4px">Montako kertaa kukin arvosana annettiin. <b>1 = paras</b> (vihreä), suurin numero = huonoin (punainen). ka = keskiarvo, pienempi on parempi.</p>'
    + '<div class="tablewrap"><table id="disttable"><thead><tr><th rowspan="2">Nro</th><th rowspan="2">Nimi</th>';
  SKILLS.forEach(function(k){ h += '<th class="sk s0" colspan="'+(k.max+2)+'">'+k.name+'</th>'; });
  h += '</tr><tr>';
  SKILLS.forEach(function(k){
    for (var g=1; g<=k.max; g++) h += '<th class="g '+gradeCls(g,k.max)+(g===1?' s0':'')+'" aria-label="'+k.name+' arvosana '+g+'">'+g+'</th>';
    h += '<th>kpl</th><th>ka</th>';
  });
  h += '</tr></thead><tbody>';
  if (!sm.rows.length) h += '<tr><td colspan="23" class="zero">Ei kirjauksia</td></tr>';

  var setTxt = set === 'all' ? 'Koko ottelu' : 'Erä ' + set;
  d.page();
  d.text('Lentopallotilastot', L, TOP + 14, 17, {bold:true});
  d.text('vs ' + (m.opponent || '?') + '  ·  ' + fiDate(m.date) + '  ·  ' + setTxt, L, TOP + 32, 12, {bold:true, color:[0.12,0.23,0.54]});
  var y = TOP + 50;
  var num = function(n, cls){ return {t: String(n), color: n ? (cls === 'p' ? PC.pos : cls === 'e' ? PC.neg : PC.ink) : PC.mute, bold: !!n && !!cls}; };
  var RH = sm.rows.length <= 12 ? 14 : 13;  // väljempi rivikorkeus, kun kaikki mahtuu yhdelle sivulle
  var players = sm.rows.map(function(r){ return {p:r.p, s:r.s, tot:false}; }).concat([{p:{num:'', name:'Joukkue yht.'}, s:sm.team, tot:true}]);
  // Taulukko 1: yhteenveto (samat sarakkeet ja järjestys kuin näytöllä)
  var cols = [{w:26},{w:104}], heads = [{t:'Nro', full:true},{t:'Nimi', full:true, align:'l'}];
  SKILLS.forEach(function(s, i){ cols.push({w:60, gs: i === 0}); heads.push({t:s.name + '\n1–' + s.max}); });
  POINTS.forEach(function(s, i){ cols.push({w:40, gs: i === 0}); heads.push({t:plainLbl(s.short)}); });
  ERRORS.forEach(function(s, i){ cols.push({w:44, gs: i === 0}); heads.push({t:plainLbl(s.short)}); });
  ['Plus','Miinus','Netto'].forEach(function(t, i){ cols.push({w:40, gs: i === 0}); heads.push({t:t}); });
  var rows1 = players.map(function(r){
    var s = r.s, c = [{t:String(r.p.num||''), bold:true}, {t:r.p.name, bold:true, align:'l'}];
    SKILLS.forEach(function(k){ var x = s[k.k]; c.push(x.n ? {t: x.n + ' / ' + dec(x.sum/x.n)} : {t:'–', color:PC.mute}); });
    POINTS.forEach(function(k){ c.push(num(s[k.k], 'p')); });
    ERRORS.forEach(function(k){ c.push(num(s[k.k], 'e')); });
    var net = s.plus - s.minus;
    c.push({t:String(s.plus), color:PC.pos, bold:true}, {t:String(s.minus), color:PC.neg, bold:true},
           {t:(net > 0 ? '+' : '') + net, color: net > 0 ? PC.pos : net < 0 ? PC.neg : PC.ink, bold:true, fs:9.5});
    return {c:c, tot:r.tot};
  });
  d.text('Yhteenveto – ' + setTxt.toLowerCase(), L, y, 10.5, {bold:true}); y += 6;
  y = pdfTable(d, L, y, {rh:RH, cols:cols, heads:heads, rows:rows1,
    groups:[{t:'',span:2},{t:'Suoritukset: kpl / keskiarvo (1 = paras)',span:SKILLS.length},{t:'Pisteet +1',span:POINTS.length},{t:'Virheet −1',span:ERRORS.length},{t:'Yhteensä',span:3}]}, ctx);
  // Taulukko 2: arvosanajakauma
  y += 10;
  var cols2 = [{w:26},{w:104}], heads2 = [{t:'Nro', full:true},{t:'Nimi', full:true, align:'l'}], groups2 = [{t:'',span:2}];
  var rest = d.W - 2*L - 130, nc = 0; SKILLS.forEach(function(k){ nc += k.max + 2; });
  var cw = rest / nc;
  SKILLS.forEach(function(k){
    groups2.push({t:k.name, span:k.max + 2});
    for (var g=1; g<=k.max; g++){
      var bg = g === 1 ? PC.g1 : g === k.max ? PC.gw : null;
      cols2.push({w:cw, bg:bg, hbg: g === 1 ? [0.73,0.97,0.82] : g === k.max ? [1,0.8,0.8] : null, gs: g === 1});
      heads2.push({t:String(g), fs:8.5});
    }
    cols2.push({w:cw, bg:[0.965,0.97,0.976]}); heads2.push({t:'kpl'});
    cols2.push({w:cw, bg:[0.965,0.97,0.976]}); heads2.push({t:'ka'});
  });
  var rows2 = players.map(function(r){
    var c = [{t:String(r.p.num||''), bold:true}, {t:r.p.name, bold:true, align:'l'}];
    SKILLS.forEach(function(k){
      var x = r.s[k.k];
      for (var g=1; g<=k.max; g++) c.push(x.n ? {t:String(x.dist[g]), color: x.dist[g] ? PC.ink : PC.mute, bold: !!x.dist[g]} : {t:''});
      c.push(x.n ? {t:String(x.n), bold:true} : {t:'–', color:PC.mute});
      c.push(x.n ? {t:dec(x.sum/x.n), bold:true} : {t:'–', color:PC.mute});
    });
    return {c:c, tot:r.tot};
  });
  var needed = 18 + 12 + 12.4 + rows2.length * RH;
  if (y + needed > ctx.bottom && rows2.length * RH + 60 < ctx.bottom - ctx.top){ d.page(); y = ctx.top; }
  d.text('Arvosanajakauma – ' + setTxt.toLowerCase() + ' (montako kertaa kukin arvosana annettiin)', L, y, 10.5, {bold:true}); y += 6;
  pdfTable(d, L, y, {rh:RH, cols:cols2, heads:heads2, rows:rows2, groups:groups2}, ctx);
  // Alatunniste joka sivulle
  var now = new Date(), stamp = 'Luotu ' + now.getDate() + '.' + (now.getMonth()+1) + '.' + now.getFullYear() + ' ' + pad(now.getHours()) + '.' + pad(now.getMinutes());
  d.pages.forEach(function(ops, i){
    d.c = ops;
    d.line(L, d.H - TOP - 13, d.W - L, d.H - TOP - 13, PC.grid, 0.5);
    d.text('1 = paras. Syöttö 1 = ässä +1, Hyökkäys 1 = hyökkäyspiste +1, S4/V4/H3 = virhe −1. Netto = pisteet (+1) − virheet (−1).', L, d.H - TOP - 3, 8, {color:[0.3,0.33,0.4]});
    d.text(stamp + '   ·   Sivu ' + (i+1) + '/' + d.pages.length, d.W - L - 200, d.H - TOP - 3, 8, {w:200, align:'r', color:[0.3,0.33,0.4]});
  });
  return d.bytes('Lentopallotilastot vs ' + (m.opponent||'') + ' ' + fiDate(m.date) + ' – ' + setTxt);
}
// Jaa PDF: luodaan synkronisesti ja kutsutaan navigator.sharea suoraan napin painalluksesta (iPadin vaatimus).
function sharePdf(m, set){
  var bytes, name = pdfName(m, set), file = null;
  try { bytes = buildReportPdf(m, set); } catch(e){ toast('PDF:n luonti epäonnistui', 'bad'); return; }
  try { file = new File([bytes], name, {type:'application/pdf'}); } catch(e){ file = null; }
  if (file && navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try {
      navigator.share({files:[file], title:'Lentopallotilastot vs ' + (m.opponent||'') + ' ' + fiDate(m.date)}).catch(function(err){
        if (err && err.name === 'AbortError') return;
        download(name, bytes, 'application/pdf');
      });
      return;
    } catch(e){}
  }
  download(name, bytes, 'application/pdf');
}
function copyText(t){
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
    ta.remove(); toast(ok ? 'Kopioitu leikepöydälle' : 'Kopiointi ei onnistunut', ok ? '' : 'bad');
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(function(){ toast('Kopioitu leikepöydälle'); }, fallback);
  else fallback();
}

// ---------- Loki ----------
function renderLog(){
  var main = document.getElementById('main'), m = cur();
  if (!m){ main.innerHTML = '<div class="card empty">Ei valittua ottelua.</div>'; return; }
  var h = '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Loki ('+m.events.length+' kirjausta)</h2>'
    + '<button class="btn" id="logundo" style="background:var(--amber)">↶ Kumoa viimeisin</button></div><p class="help">Uusin ylimpänä. Poista yksittäinen kirjaus Poista-painikkeella.</p><div id="loglist">';
  if (!m.events.length) h += '<div class="empty">Ei kirjauksia</div>';
  for (var i = m.events.length-1; i >= 0; i--){
    var e = m.events[i];
    h += '<div class="logrow"><span class="t">'+fiTime(e.ts)+'<br>Erä '+e.set+'</span><span class="what"><b>'+esc(pLabel(e.num,e.name))+'</b> '+evTag(e)+'</span>'
      + '<button class="del" data-id="'+e.id+'">Poista</button></div>';
  }
  main.innerHTML = h + '</div></div>';
  document.getElementById('logundo').onclick = function(){ undo(); renderLog(); };
  document.getElementById('loglist').onclick = function(ev){
    var b = ev.target.closest('.del'); if (!b) return;
    var idx = -1; m.events.forEach(function(e,i){ if (e.id === b.dataset.id) idx = i; });
    if (idx < 0) return;
    var e = m.events[idx];
    ask('Poistetaanko kirjaus: ' + pLabel(e.num,e.name) + ' – ' + evLabel(e) + '?', 'Poista', function(){
      m.events.splice(idx, 1); save(); toast('Kirjaus poistettu', 'warn'); renderLog();
    });
  };
}

// ---------- Pelaajat ----------
function renderRoster(){
  var main = document.getElementById('main');
  var h = '<div class="card"><h2>Pelaajat ('+S.roster.length+'/'+MAXP+')</h2><p class="help">Muutokset tallentuvat automaattisesti. Rastita passarit, niin passi-rivi korostuu heille.</p>'
    + '<div class="prow" style="font-weight:800;font-size:18px;color:var(--muted)"><div>Numero</div><div>Nimi</div><div>Passari</div><div></div></div><div id="plist">';
  S.roster.forEach(function(p){
    h += '<div class="prow" data-id="'+p.id+'"><input type="number" inputmode="numeric" min="0" max="99" class="pnum" value="'+esc(p.num)+'" aria-label="Pelinumero">'
      + '<input type="text" class="pname" value="'+esc(p.name)+'" placeholder="Nimi" autocomplete="off" aria-label="Nimi">'
      + '<label class="chk'+(p.setter?' on':'')+'"><input type="checkbox" class="pset"'+(p.setter?' checked':'')+'> Passari</label>'
      + '<button class="x" aria-label="Poista pelaaja">×</button></div>';
  });
  h += '</div><div class="row" style="margin-top:14px"><button class="btn big green" id="addp"'+(S.roster.length>=MAXP?' disabled style="opacity:.4"':'')+'>+ Lisää pelaaja</button>'
    + '<button class="btn big" id="todone">Valmis</button></div></div>';
  main.innerHTML = h;
  var list = document.getElementById('plist');
  function rowP(el){ var r = el.closest('.prow'); return r ? pById(r.dataset.id) : null; }
  list.addEventListener('input', function(ev){
    var p = rowP(ev.target); if (!p) return;
    if (ev.target.classList.contains('pnum')) p.num = ev.target.value.replace(/[^0-9]/g,'').slice(0,3);
    if (ev.target.classList.contains('pname')) p.name = ev.target.value.slice(0,30);
    if (ev.target.classList.contains('pset')){ p.setter = ev.target.checked; ev.target.parentNode.classList.toggle('on', p.setter); }
    var m = cur(); if (m) syncMatchPlayerIfPresent(m, p);
    save();
  });
  list.addEventListener('change', function(ev){
    if (!ev.target.classList.contains('pset')) return;
    var p = rowP(ev.target); if (!p) return;
    p.setter = ev.target.checked; ev.target.parentNode.classList.toggle('on', p.setter); save();
  });
  list.addEventListener('click', function(ev){
    if (!ev.target.classList.contains('x')) return;
    var p = rowP(ev.target); if (!p) return;
    ask('Poistetaanko pelaaja ' + pLabel(p.num, p.name || '(nimetön)') + '? Aiemmat tilastot säilyvät.', 'Poista', function(){
      S.roster = S.roster.filter(function(x){ return x.id !== p.id; }); save(); renderRoster();
    });
  });
  document.getElementById('addp').onclick = function(){
    if (S.roster.length >= MAXP) return;
    var p = {id:uid(), num:'', name:'', setter:false}; S.roster.push(p); save(); renderRoster();
    var ins = document.querySelectorAll('.prow[data-id="'+p.id+'"] .pnum'); if (ins[0]) ins[0].focus();
  };
  document.getElementById('todone').onclick = function(){
    var empty = S.roster.filter(function(p){ return !p.name && !p.num; });
    if (empty.length){ S.roster = S.roster.filter(function(p){ return p.name || p.num; }); save(); }
    go(cur() ? 'kirjaa' : 'ottelut');
  };
}
function syncMatchPlayerIfPresent(m, p){
  (m.players||[]).forEach(function(x){ if (x.id===p.id){ x.num=p.num; x.name=p.name; x.setter=!!p.setter; } });
}

// ---------- Ottelut ----------
function renderMatches(){
  var main = document.getElementById('main');
  var h = '<div class="card"><h2>Uusi ottelu</h2><div class="row" style="align-items:flex-end">'
    + '<div class="field" style="flex:2;min-width:260px"><label for="opp">Vastustaja</label><input type="text" id="opp" placeholder="esim. Kisa-Veikot" autocomplete="off"></div>'
    + '<div class="field" style="flex:1;min-width:200px"><label for="mdate">Päivämäärä</label><input type="date" id="mdate" value="'+today()+'"></div>'
    + '<div class="field"><button class="btn big green" id="newm">Aloita ottelu</button></div></div>'
    + (S.roster.length ? '' : '<p class="help" style="color:var(--red)">Lisää ensin pelaajat Pelaajat-välilehdellä.</p>') + '</div>'
    + '<div class="card"><h2>Tallennetut ottelut</h2><div id="mlist">';
  var ms = S.matches.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || b.created - a.created; });
  if (!ms.length) h += '<div class="empty">Ei vielä otteluita</div>';
  ms.forEach(function(m){
    h += '<div class="mrow'+(m.id===S.currentId?' cur':'')+'" data-id="'+m.id+'"><div class="info"><b>vs '+esc(m.opponent||'?')+'</b><br>'+fiDate(m.date)
      + ' · ' + m.events.length + ' kirjausta · ' + setsOf(m).length + ' erää' + (m.id===S.currentId?' · <b>valittu</b>':'') + '</div>'
      + '<button class="btn" data-a="sum">Yhteenveto</button><button class="btn gray" data-a="rec">Jatka kirjaamista</button>'
      + '<button class="btn red" data-a="del">Poista</button></div>';
  });
  h += '</div></div><div class="card"><h3>Varmuuskopio</h3><p class="help">Tallenna kaikki tiedot (pelaajat ja ottelut) tiedostoksi: valitse jakovalikosta &quot;Tallenna tiedostoihin&quot; ja esim. iCloud Drive. Palauta-napilla valitset tiedoston Tiedostot-sovelluksesta.</p><div class="row">'
    + '<button class="btn gray" id="bk">Tallenna varmuuskopio</button><button class="btn gray" id="rs">Palauta varmuuskopio</button>'
    + '<input type="file" id="rsfile" accept=".json,application/json" class="hidden"></div></div>';
  main.innerHTML = h;
  document.getElementById('newm').onclick = function(){
    if (!S.roster.length){ toast('Lisää ensin pelaajat', 'warn'); go('pelaajat'); return; }
    var opp = document.getElementById('opp').value.trim();
    if (!opp){ toast('Kirjoita vastustajan nimi', 'warn'); document.getElementById('opp').focus(); return; }
    var m = {id:uid(), opponent:opp.slice(0,40), date:document.getElementById('mdate').value || today(), created:Date.now(), set:1, events:[],
             players:S.roster.map(function(p){ return {id:p.id, num:p.num, name:p.name, setter:!!p.setter}; })};
    S.matches.push(m); S.currentId = m.id; save(); sumSet = 'all';
    toast('Ottelu aloitettu: vs ' + m.opponent); go('kirjaa');
  };
  document.getElementById('mlist').onclick = function(ev){
    var b = ev.target.closest('button'); if (!b) return;
    var id = b.closest('.mrow').dataset.id, m = S.matches.filter(function(x){ return x.id===id; })[0]; if (!m) return;
    if (b.dataset.a === 'sum'){ S.currentId = id; save(); sumSet = 'all'; go('yhteenveto'); }
    else if (b.dataset.a === 'rec'){ S.currentId = id; save(); go('kirjaa'); }
    else if (b.dataset.a === 'del') ask('Poistetaanko ottelu vs ' + (m.opponent||'?') + ' (' + fiDate(m.date) + ') ja kaikki sen tilastot?', 'Poista', function(){
      S.matches = S.matches.filter(function(x){ return x.id !== id; });
      if (S.currentId === id) S.currentId = null;
      save(); go('ottelut');
    });
  };
  document.getElementById('bk').onclick = function(){
    var name = 'lentopallo_varmuuskopio_' + today() + '.json', json = JSON.stringify(S, null, 1), file = null;
    try { file = new File([json], name, {type:'application/json'}); } catch(e){ file = null; }
    if (file && navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      try {
        navigator.share({files:[file], title:'Lentopallotilastot varmuuskopio'}).then(function(){
          toast('Varmuuskopio tallennettu');
        }).catch(function(err){
          if (err && err.name === 'AbortError') return;
          download(name, json, 'application/json');
        });
        return;
      } catch(e){}
    }
    download(name, json, 'application/json');
  };
  document.getElementById('rs').onclick = function(){ document.getElementById('rsfile').click(); };
  document.getElementById('rsfile').onchange = function(ev){
    var f = ev.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try {
        var o = JSON.parse(rd.result);
        if (!o || !Array.isArray(o.roster) || !Array.isArray(o.matches)) throw 0;
        ask('Korvataanko nykyiset tiedot varmuuskopiolla (' + o.matches.length + ' ottelua)?', 'Palauta', function(){ S = o; save(); toast('Varmuuskopio palautettu'); go('ottelut'); });
      } catch(e){ toast('Virheellinen tiedosto', 'bad'); }
    };
    rd.readAsText(f);
  };
}

// ---------- Käynnistys ----------
go(!S.roster.length ? 'pelaajat' : (cur() ? 'kirjaa' : 'ottelut'));
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
